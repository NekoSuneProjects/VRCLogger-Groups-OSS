<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safety Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#070b10",
            panel: "#0d141b",
            line: "#1e2b33"
          },
          boxShadow: {
            glow: "0 0 40px rgba(16, 185, 129, 0.16)"
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      background:
        radial-gradient(circle at 10% 0%, rgba(16, 185, 129, 0.18), transparent 28rem),
        radial-gradient(circle at 90% 0%, rgba(6, 182, 212, 0.10), transparent 24rem),
        #070b10;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased">
  <main class="mx-auto max-w-7xl px-4 py-6 lg:px-6">
    <header class="mb-6 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="flex h-11 w-11 items-center justify-center rounded-lg bg-emerald-400/15 text-emerald-300">
          <i data-lucide="shield-alert" class="h-6 w-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-semibold">Safety Admin Panel</h1>
          <p class="text-sm text-slate-400">Bot developer access only</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/dashboard" class="inline-flex h-10 items-center gap-2 rounded-lg border border-line px-3 text-sm text-slate-300 hover:border-emerald-400/50 hover:text-emerald-200">
          <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
          Dashboard
        </a>
        <a href="/auth/logout" class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-line text-slate-300 hover:border-red-400/50 hover:text-red-200" title="Logout">
          <i data-lucide="log-out" class="h-4 w-4"></i>
        </a>
      </div>
    </header>

    <section id="status" class="mb-5 hidden rounded-lg border p-3 text-sm"></section>

    <div class="grid gap-5 lg:grid-cols-[320px_minmax(0,1fr)]">
      <aside class="rounded-lg border border-line bg-panel/88 p-4 shadow-glow">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="font-semibold">Safety Lists</h2>
          <button id="refreshButton" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-line text-slate-300 hover:border-emerald-400/50 hover:text-emerald-200" title="Refresh">
            <i data-lucide="refresh-cw" class="h-4 w-4"></i>
          </button>
        </div>
        <div id="listPicker" class="space-y-2"></div>
      </aside>

      <section class="space-y-5">
        <div class="rounded-lg border border-line bg-panel/88 p-4 shadow-glow">
          <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 id="editorTitle" class="font-semibold">Loading</h2>
              <p id="editorDescription" class="mt-1 text-sm text-slate-500"></p>
            </div>
            <span id="updatedAt" class="rounded-md bg-slate-950 px-2 py-1 text-xs text-slate-500"></span>
          </div>

          <div class="mb-4 grid gap-2 sm:grid-cols-[minmax(0,1fr)_auto]">
            <input id="newItemInput" placeholder='Add item, or JSON object like {"avatarId":"avtr_...","crasher":true}' class="rounded-lg border border-line bg-slate-950 px-3 py-2 text-sm text-slate-200 outline-none placeholder:text-slate-600 focus:border-emerald-400" />
            <button id="addItemButton" class="inline-flex items-center justify-center gap-2 rounded-lg bg-emerald-400 px-3 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-300">
              <i data-lucide="plus" class="h-4 w-4"></i>
              Add
            </button>
          </div>

          <label class="block text-sm">
            <span class="mb-2 block text-slate-400">List JSON</span>
            <textarea id="listEditor" spellcheck="false" class="min-h-[360px] w-full rounded-lg border border-line bg-slate-950 p-3 font-mono text-xs leading-5 text-slate-200 outline-none focus:border-emerald-400"></textarea>
          </label>
          <div class="mt-3 flex flex-wrap gap-2">
            <button id="saveListButton" class="inline-flex items-center gap-2 rounded-lg bg-emerald-400 px-3 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-300">
              <i data-lucide="save" class="h-4 w-4"></i>
              Save List
            </button>
            <button id="formatListButton" class="inline-flex items-center gap-2 rounded-lg border border-line px-3 py-2 text-sm text-slate-300 hover:border-emerald-400/50 hover:text-emerald-200">
              <i data-lucide="braces" class="h-4 w-4"></i>
              Format JSON
            </button>
          </div>
        </div>

        <div class="rounded-lg border border-line bg-panel/88 p-4">
          <h2 class="mb-3 font-semibold">Items</h2>
          <div id="itemList" class="grid gap-2"></div>
        </div>

        <div class="rounded-lg border border-line bg-panel/88 p-4">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="font-semibold">Archive</h2>
              <p class="mt-1 text-sm text-slate-500">Deleted items are hidden from pulls but kept here for admin lookup.</p>
            </div>
            <button id="loadArchiveButton" class="inline-flex items-center gap-2 rounded-lg border border-line px-3 py-2 text-sm text-slate-300 hover:border-emerald-400/50 hover:text-emerald-200">
              <i data-lucide="archive" class="h-4 w-4"></i>
              Load Archive
            </button>
          </div>
          <div id="archiveList" class="grid gap-2"></div>
        </div>

        <div class="rounded-lg border border-line bg-panel/88 p-4">
          <h2 class="mb-3 font-semibold">Pull Endpoints</h2>
          <div id="endpointList" class="grid gap-2 sm:grid-cols-2"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const state = {
      definitions: {},
      lists: {},
      endpoints: {},
      archiveCounts: {},
      archiveRows: [],
      selected: "ipgrabber_domains",
      updatedAt: ""
    };

    const els = {
      status: document.getElementById("status"),
      listPicker: document.getElementById("listPicker"),
      editorTitle: document.getElementById("editorTitle"),
      editorDescription: document.getElementById("editorDescription"),
      updatedAt: document.getElementById("updatedAt"),
      newItemInput: document.getElementById("newItemInput"),
      listEditor: document.getElementById("listEditor"),
      itemList: document.getElementById("itemList"),
      archiveList: document.getElementById("archiveList"),
      endpointList: document.getElementById("endpointList")
    };

    function iconify() {
      if (window.lucide) window.lucide.createIcons();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showStatus(message, tone = "ok") {
      els.status.className = `mb-5 rounded-lg border p-3 text-sm ${tone === "error" ? "border-red-400/30 bg-red-950/30 text-red-100" : "border-emerald-400/30 bg-emerald-400/10 text-emerald-100"}`;
      els.status.textContent = message;
      els.status.classList.remove("hidden");
      window.clearTimeout(showStatus.timer);
      showStatus.timer = window.setTimeout(() => els.status.classList.add("hidden"), 3500);
    }

    async function request(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: {
          Accept: "application/json",
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        }
      });
      if (res.status === 401) {
        window.location.href = `/auth/discord?returnTo=${encodeURIComponent(window.location.pathname)}`;
        throw new Error("Not authenticated");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || "Request failed");
      return data;
    }

    function parseEditor() {
      const raw = els.listEditor.value.trim();
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) throw new Error("List JSON must be an array.");
        return parsed;
      } catch (err) {
        return raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      }
    }

    function parseNewItem() {
      const raw = els.newItemInput.value.trim();
      if (!raw) return null;
      if (raw.startsWith("{") || raw.startsWith("[")) {
        try { return JSON.parse(raw); } catch (err) { throw new Error("New item JSON is invalid."); }
      }
      return raw;
    }

    function currentItems() {
      return state.lists[state.selected] || [];
    }

    function itemToEditableText(item) {
      return typeof item === "string" ? item : JSON.stringify(item, null, 2);
    }

    function groupPublicButton(item, index) {
      if (state.selected !== "blacklist_groups") return "";
      const isPublic = Boolean(item && typeof item === "object" && item.public === true);
      return `<button data-toggle-public-index="${index}" class="toggle-public-button inline-flex h-8 items-center gap-2 rounded-lg border ${isPublic ? "border-emerald-400/40 text-emerald-200" : "border-line text-slate-400"} px-2 text-xs hover:border-emerald-400/60">
        <i data-lucide="${isPublic ? "eye" : "eye-off"}" class="h-3.5 w-3.5"></i>
        ${isPublic ? "Public" : "Private"}
      </button>`;
    }

    function render() {
      const definition = state.definitions[state.selected] || {};
      els.editorTitle.textContent = definition.label || state.selected;
      els.editorDescription.textContent = definition.description || "";
      els.updatedAt.textContent = state.updatedAt ? `Updated ${new Date(state.updatedAt).toLocaleString()}` : "";
      els.listEditor.value = JSON.stringify(currentItems(), null, 2);

      els.listPicker.innerHTML = Object.entries(state.definitions).map(([key, item]) => `
        <button data-list-key="${escapeHtml(key)}" class="list-button flex w-full items-center justify-between gap-3 rounded-lg border px-3 py-2 text-left text-sm ${key === state.selected ? "border-emerald-400/60 bg-emerald-400/10 text-emerald-100" : "border-line bg-slate-950/35 text-slate-300 hover:border-emerald-400/40"}">
          <span class="min-w-0">
            <span class="block truncate font-medium">${escapeHtml(item.label || key)}</span>
            <span class="block text-xs text-slate-500">${escapeHtml(key)}</span>
          </span>
          <span class="shrink-0 text-right">
            <span class="block rounded-md bg-slate-950 px-2 py-1 text-xs text-slate-500">${(state.lists[key] || []).length}</span>
            <span class="mt-1 block text-[11px] text-slate-600">${state.archiveCounts[key] || 0} archived</span>
          </span>
        </button>
      `).join("");

      els.itemList.innerHTML = currentItems().map((item, index) => `
        <div class="flex items-start gap-2 rounded-lg border border-line bg-slate-950/35 p-3 text-sm">
          <code class="min-w-0 flex-1 break-all text-xs leading-5 text-slate-300">${escapeHtml(typeof item === "string" ? item : JSON.stringify(item))}</code>
          <div class="flex shrink-0 flex-wrap justify-end gap-2">
            ${groupPublicButton(item, index)}
            <button data-edit-index="${index}" class="edit-item-button inline-flex h-8 items-center gap-2 rounded-lg border border-line px-2 text-xs text-slate-300 hover:border-emerald-400/50 hover:text-emerald-200" title="Edit item">
              <i data-lucide="pencil" class="h-3.5 w-3.5"></i>
              Edit
            </button>
            <button data-delete-index="${index}" class="delete-item-button inline-flex h-8 items-center gap-2 rounded-lg border border-red-400/30 px-2 text-xs text-red-200 hover:bg-red-400/10" title="Archive item">
              <i data-lucide="archive-x" class="h-3.5 w-3.5"></i>
              Archive
            </button>
          </div>
        </div>
      `).join("") || `
        <div class="rounded-lg border border-dashed border-line p-6 text-center text-sm text-slate-500">No items in this list.</div>`;

      els.archiveList.innerHTML = state.archiveRows.length ? state.archiveRows.map(row => `
        <div class="rounded-lg border border-line bg-slate-950/35 p-3 text-sm">
          <div class="mb-2 flex flex-wrap items-center gap-2 text-xs text-slate-500">
            <span>${escapeHtml(row.archivedAt ? new Date(row.archivedAt).toLocaleString() : "Archived")}</span>
            ${row.archivedByName ? `<span>by ${escapeHtml(row.archivedByName)}</span>` : ""}
          </div>
          <code class="block break-all text-xs leading-5 text-slate-300">${escapeHtml(JSON.stringify(row.item))}</code>
        </div>
      `).join("") : `
        <div class="rounded-lg border border-dashed border-line p-6 text-center text-sm text-slate-500">Archive not loaded for this list.</div>`;

      els.endpointList.innerHTML = Object.entries(state.endpoints).map(([key, value]) => `
        <div class="rounded-lg border border-line bg-slate-950/35 p-3">
          <div class="mb-1 text-xs text-slate-500">${escapeHtml(key)}</div>
          <code class="break-all text-xs text-emerald-200">${escapeHtml(value)}</code>
        </div>
      `).join("");

      document.querySelectorAll(".list-button").forEach(button => {
        button.addEventListener("click", () => {
          state.selected = button.dataset.listKey;
          state.archiveRows = [];
          render();
        });
      });
      document.querySelectorAll(".edit-item-button").forEach(button => {
        button.addEventListener("click", () => editItem(Number(button.dataset.editIndex)));
      });
      document.querySelectorAll(".toggle-public-button").forEach(button => {
        button.addEventListener("click", () => togglePublic(Number(button.dataset.togglePublicIndex)));
      });
      document.querySelectorAll(".delete-item-button").forEach(button => {
        button.addEventListener("click", () => deleteItem(Number(button.dataset.deleteIndex)));
      });
      iconify();
    }

    async function load() {
      const data = await request("/api/admin/safety");
      state.definitions = data.definitions || {};
      state.lists = data.lists || {};
      state.endpoints = data.endpoints || {};
      state.archiveCounts = data.archiveCounts || {};
      state.updatedAt = data.updatedAt || "";
      if (!state.definitions[state.selected]) state.selected = Object.keys(state.definitions)[0] || "";
      render();
    }

    async function saveList() {
      const items = parseEditor();
      const data = await request(`/api/admin/safety/lists/${encodeURIComponent(state.selected)}`, {
        method: "PUT",
        body: JSON.stringify({ items })
      });
      state.lists = data.lists || {};
      state.archiveCounts = data.archiveCounts || {};
      state.updatedAt = data.updatedAt || "";
      showStatus(data.message || "Safety list saved.");
      render();
    }

    async function addItem() {
      const item = parseNewItem();
      if (item == null) return showStatus("Enter an item first.", "error");
      const data = await request(`/api/admin/safety/lists/${encodeURIComponent(state.selected)}/items`, {
        method: "POST",
        body: JSON.stringify({ item })
      });
      els.newItemInput.value = "";
      state.lists = data.lists || {};
      state.archiveCounts = data.archiveCounts || {};
      state.updatedAt = data.updatedAt || "";
      showStatus(data.message || "Safety item added.");
      render();
    }

    async function updateItem(index, item, message = "Safety item updated.") {
      const data = await request(`/api/admin/safety/lists/${encodeURIComponent(state.selected)}/items/${index}`, {
        method: "PATCH",
        body: JSON.stringify({ item })
      });
      state.lists = data.lists || {};
      state.archiveCounts = data.archiveCounts || {};
      state.updatedAt = data.updatedAt || "";
      showStatus(data.message || message);
      render();
    }

    async function editItem(index) {
      if (!Number.isInteger(index)) return;
      const current = currentItems()[index];
      const value = window.prompt("Edit this safety item as text or JSON.", itemToEditableText(current));
      if (value == null) return;
      let item = value.trim();
      if (!item) return showStatus("Item cannot be empty.", "error");
      if (item.startsWith("{") || item.startsWith("[")) {
        try { item = JSON.parse(item); } catch { return showStatus("Edited item JSON is invalid.", "error"); }
      }
      await updateItem(index, item);
    }

    async function togglePublic(index) {
      if (!Number.isInteger(index)) return;
      const current = currentItems()[index];
      const objectItem = current && typeof current === "object"
        ? { ...current }
        : { groupID: String(current || ""), name: String(current || ""), type: "UNKNOWN" };
      objectItem.public = !Boolean(objectItem.public);
      await updateItem(index, objectItem, objectItem.public ? "Group entry is now public." : "Group entry is now private.");
    }

    async function deleteItem(index) {
      if (!Number.isInteger(index)) return;
      const data = await request(`/api/admin/safety/lists/${encodeURIComponent(state.selected)}/items/${index}`, {
        method: "DELETE"
      });
      state.lists = data.lists || {};
      state.archiveCounts = data.archiveCounts || {};
      state.updatedAt = data.updatedAt || "";
      showStatus(data.message || "Safety item archived.");
      render();
    }

    async function loadArchive() {
      const data = await request(`/api/admin/safety/archive/${encodeURIComponent(state.selected)}`);
      state.archiveRows = data.rows || [];
      render();
    }

    document.getElementById("refreshButton").addEventListener("click", load);
    document.getElementById("loadArchiveButton").addEventListener("click", () => {
      loadArchive().catch(err => showStatus(err.message, "error"));
    });
    document.getElementById("saveListButton").addEventListener("click", () => {
      saveList().catch(err => showStatus(err.message, "error"));
    });
    document.getElementById("addItemButton").addEventListener("click", () => {
      addItem().catch(err => showStatus(err.message, "error"));
    });
    document.getElementById("formatListButton").addEventListener("click", () => {
      try {
        els.listEditor.value = JSON.stringify(parseEditor(), null, 2);
      } catch (err) {
        showStatus(err.message, "error");
      }
    });
    els.newItemInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        addItem().catch(err => showStatus(err.message, "error"));
      }
    });

    load().catch(err => showStatus(err.message, "error"));
    iconify();
  </script>
</body>
</html>
