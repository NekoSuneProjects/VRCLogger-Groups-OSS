<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VRCLogger OBS Overlay</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .overlay {
      display: inline-block;
      margin: 18px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.52);
      border-left: 4px solid #47d7ac;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      min-width: 360px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .line {
      font-size: 15px;
      line-height: 1.45;
    }

    .muted {
      color: #d7dde4;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title" id="worldName">World loading...</div>
    <div class="line">World ID: <span id="worldId" class="muted">Unknown</span></div>
    <div class="line">Instance: <span id="location" class="muted">Unknown</span></div>
    <div class="line">VRChat: <span id="vrchatUser" class="muted">Unknown</span></div>
    <div class="line">Discord: <span id="discordUser" class="muted">Not linked</span></div>
    <div class="line">Time: <span id="currentTime" class="muted"></span></div>
  </div>

  <script>
    function setText(id, value, fallback = "Unknown") {
      document.getElementById(id).textContent = value || fallback;
    }

    async function refreshOverlay() {
      try {
        const response = await fetch("/overlay/state", {
          headers: { Accept: "application/json" }
        });
        const state = await response.json();
        setText("worldName", state.worldName, "World loading...");
        setText("worldId", state.worldId);
        setText("location", state.location || state.instanceId);
        setText("vrchatUser", state.localVrchatUsername);
        setText("discordUser", state.discordDisplayName, "Not linked");
      } catch {
        setText("worldName", "Overlay waiting for client...");
      }

      document.getElementById("currentTime").textContent =
        new Date().toLocaleTimeString();
    }

    refreshOverlay();
    setInterval(refreshOverlay, 1000);
  </script>
</body>
</html>
